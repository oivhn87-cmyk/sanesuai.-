<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col transition-colors duration-200">

    <div id="app" class="flex h-full w-full overflow-hidden relative">

        <!-- Sidebar / Chat History -->
        <aside id="sidebar" class="absolute md:relative z-30 inset-y-0 left-0 w-72 bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <button onclick="createNewChat()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-plus"></i> 新しいチャット
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2.5 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Chat History List -->
            <div id="history-list" class="flex-1 overflow-y-auto p-3 space-y-1">
                <!-- Dynamically populated -->
            </div>

            <!-- Sidebar Footer / Settings -->
            <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-circle text-emerald-500 text-[8px]"></i> Gemini 3 Flash</span>
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-950 relative overflow-hidden">
            <!-- Header -->
            <header class="h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 md:px-6 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <h1 id="current-chat-title" class="font-semibold text-base truncate max-w-[200px] md:max-w-md">新しいチャット</h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openSettingsModal()" class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors text-sm flex items-center gap-2">
                        <i class="fa-solid fa-sliders"></i> <span class="hidden sm:inline">システム設定</span>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Scroll Container -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Welcome State -->
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center max-w-lg mx-auto space-y-4 py-12">
                    <div class="w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl shadow-inner">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <h2 class="text-2xl font-bold tracking-tight">Gemini AI へようこそ</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                        何でも気軽にご質問ください。コードの生成、アイデア出し、文章の要約など、様々なタスクをサポートします。
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full pt-4">
                        <button onclick="sendPreset('自己紹介をして、あなたができることを教えて')" class="p-3 text-left text-xs bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl transition-all">
                            ✨ できることを教えて
                        </button>
                        <button onclick="sendPreset('JavaScriptで簡単なカウントダウンタイマーのコードを書いて')" class="p-3 text-left text-xs bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl transition-all">
                            💻 コードを書いてもらう
                        </button>
                        <button onclick="sendPreset('効率的なタスク管理のコツを3つ教えて')" class="p-3 text-left text-xs bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl transition-all">
                            🚀 生産性を高めるコツ
                        </button>
                        <button onclick="sendPreset('美味しいオムライスの作り方を教えて')" class="p-3 text-left text-xs bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl transition-all">
                            🍳 レシピを教えて
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="p-4 md:p-6 bg-gradient-to-t from-white via-white dark:from-slate-950 dark:via-slate-950 to-transparent">
                <div class="max-w-4xl mx-auto">
                    <form id="chat-form" onsubmit="handleChatSubmit(event)" class="relative flex items-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500 transition-all">
                        <textarea id="user-input" rows="1" placeholder="メッセージを入力..." onkeydown="handleKeyDown(event)" class="w-full pl-4 pr-12 py-3.5 bg-transparent text-sm focus:outline-none resize-none max-h-36"></textarea>
                        <button type="submit" id="send-button" class="absolute right-2.5 bottom-2.5 w-9 h-9 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white rounded-xl flex items-center justify-center transition-all shadow-sm">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </form>
                    <div class="text-center mt-2">
                        <span class="text-[11px] text-slate-400 dark:text-slate-500">Gemini can make mistakes. Verify important info.</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h3 class="font-semibold text-base">システム設定</h3>
                <button onclick="closeSettingsModal()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 text-sm">
                <div>
                    <label class="block font-medium mb-1.5 text-slate-700 dark:text-slate-300">システムプロンプト (役割)</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs"></textarea>
                    <p class="text-[11px] text-slate-400 mt-1">AIのキャラクターや回答のトーンを指定できます。</p>
                </div>
            </div>
            <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex justify-end gap-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 rounded-xl text-xs font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">キャンセル</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-xl text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm">保存する</button>
            </div>
        </div>
    </div>

    <!-- Notification Message Box -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-xs flex items-center gap-3 transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">通知メッセージ</span>
    </div>

    <script>
        // State Management
        let chats = JSON.parse(localStorage.getItem('gemini_chats') || '[]');
        let currentChatId = chats.length > 0 ? chats[0].id : null;
        let systemPrompt = localStorage.getItem('gemini_system_prompt') || 'あなたは親切で優秀なAIアシスタントです。ユーザーの質問に正確かつ分かりやすく回答してください。';
        let isGenerating = false;

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('history-list');
        const currentChatTitle = document.getElementById('current-chat-title');
        const systemPromptInput = document.getElementById('system-prompt-input');

        // Initialization
        window.onload = function() {
            // Theme setup
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun text-sm';
            }
            systemPromptInput.value = systemPrompt;
            
            if (!currentChatId && chats.length === 0) {
                createNewChat(false);
            } else {
                renderHistoryList();
                loadCurrentChat();
            }
            autoResizeTextarea();
        };

        // Textarea auto-resize
        userInput.addEventListener('input', autoResizeTextarea);
        function autoResizeTextarea() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
        }

        // Sidebar Toggle for Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Settings Modal
        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }
        function saveSettings() {
            systemPrompt = systemPromptInput.value.trim() || 'あなたは親切なAIアシスタントです。';
            localStorage.setItem('gemini_system_prompt', systemPrompt);
            closeSettingsModal();
            showToast('設定を保存しました');
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Chat Management
        function createNewChat(render = true) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: '新しいチャット',
                messages: []
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            renderHistoryList();
            loadCurrentChat();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function saveChats() {
            localStorage.setItem('gemini_chats', JSON.stringify(chats));
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl text-xs cursor-pointer transition-all ${isActive ? 'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-medium' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800/60'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate flex-1" onclick="switchChat('${chat.id}')">
                        <i class="fa-regular fa-message text-slate-400"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-red-500 transition-opacity">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                historyList.appendChild(div);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            renderHistoryList();
            loadCurrentChat();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) {
                createNewChat(false);
            } else if (currentChatId === id) {
                currentChatId = chats[0].id;
            }
            saveChats();
            renderHistoryList();
            loadCurrentChat();
            showToast('チャットを削除しました');
        }

        function loadCurrentChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            currentChatTitle.textContent = chat.title;
            chatContainer.innerHTML = '';
            
            if (chat.messages.length === 0) {
                chatContainer.appendChild(welcomeScreen);
                welcomeScreen.style.display = 'flex';
            } else {
                welcomeScreen.style.display = 'none';
                chat.messages.forEach(msg => appendMessageElement(msg.role, msg.content, false));
                scrollToBottom();
            }
        }

        // Presets & Submit handling
        function sendPreset(text) {
            userInput.value = text;
            autoResizeTextarea();
            handleChatSubmit(new Event('submit'));
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChatSubmit(new Event('submit'));
            }
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            // Hide welcome screen on first message
            if (chat.messages.length === 0) {
                welcomeScreen.style.display = 'none';
                // Auto set chat title from first prompt
                chat.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
                currentChatTitle.textContent = chat.title;
                renderHistoryList();
            }

            userInput.value = '';
            autoResizeTextarea();

            // Add user message
            const userMsg = { role: 'user', content: text };
            chat.messages.push(userMsg);
            appendMessageElement('user', text, true);
            saveChats();

            // Prepare AI placeholder
            isGenerating = true;
            const aiMsgId = 'msg_' + Date.now();
            appendMessageElement('model', '', true, aiMsgId);

            try {
                // Call Gemini API with Exponential Backoff
                const responseText = await callGeminiAPIWithRetry(chat.messages);
                
                // Update AI message
                const aiMsgObj = { role: 'model', content: responseText };
                chat.messages.push(aiMsgObj);
                saveChats();

                updateMessageElement(aiMsgId, responseText);
            } catch (err) {
                console.error(err);
                updateMessageElement(aiMsgId, 'エラーが発生しました。しばらく待ってから再度お試しください。');
                showToast('API通信エラーが発生しました', 'error');
            } finally {
                isGenerating = false;
            }
        }

        // Gemini API Implementation with Exponential Backoff
        async function callGeminiAPIWithRetry(messages, retries = 3, delay = 1000) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent`;
            
            // Format history for Gemini API
            const contents = messages.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.content }]
            }));

            const payload = {
                contents: contents,
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        return candidate.content.parts[0].text;
                    } else {
                        throw new Error('Invalid response structure from API');
                    }
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
                }
            }
        }

        // UI Helpers for Messages
        function appendMessageElement(role, content, animate = false, customId = null) {
            const isUser = role === 'user';
            const div = document.createElement('div');
            if (customId) div.id = customId;
            div.className = `flex gap-4 max-w-4xl mx-auto w-full ${isUser ? 'justify-end' : 'justify-start'} ${animate ? 'animate-fade-in' : ''}`;

            const avatar = isUser 
                ? `<div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0 text-xs shadow-sm"><i class="fa-solid fa-user"></i></div>`
                : `<div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0 text-xs shadow-sm"><i class="fa-solid fa-wand-magic-sparkles"></i></div>`;

            const bubbleClass = isUser
                ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 text-sm max-w-[85%] md:max-w-[75%] leading-relaxed shadow-sm'
                : 'bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100 rounded-2xl rounded-tl-sm px-4 py-3 text-sm max-w-[85%] md:max-w-[75%] leading-relaxed shadow-sm';

            if (isUser) {
                div.innerHTML = `
                    <div class="${bubbleClass} whitespace-pre-wrap">${escapeHtml(content)}</div>
                    ${avatar}
                `;
            } else {
                const contentHtml = content ? formatMarkdown(content) : `<span class="inline-flex items-center gap-1.5 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i> 思考中...</span>`;
                div.innerHTML = `
                    ${avatar}
                    <div class="${bubbleClass} space-y-2 w-full overflow-hidden">
                        <div class="markdown-body">${contentHtml}</div>
                    </div>
                `;
            }

            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function updateMessageElement(id, content) {
            const el = document.getElementById(id);
            if (!el) return;
            const bubble = el.querySelector('.markdown-body');
            if (bubble) {
                bubble.innerHTML = formatMarkdown(content);
            }
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Basic Markdown & Code block formatter
        function formatMarkdown(text) {
            // Escape HTML first for safety
            let escaped = escapeHtml(text);

            // Code blocks
            escaped = escaped.replace(/```([a-z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<div class="my-3 rounded-xl overflow-hidden border border-slate-700 bg-slate-900 text-slate-100 text-xs">
                    <div class="bg-slate-800 px-4 py-1.5 flex justify-between items-center text-slate-400 font-mono border-b border-slate-700">
                        <span>${lang || 'code'}</span>
                        <button onclick="copyCode(this)" class="hover:text-white transition-colors"><i class="fa-regular fa-copy"></i> コピー</button>
                    </div>
                    <pre class="p-4 overflow-x-auto font-mono"><code>${code.trim()}</code></pre>
                </div>`;
            });

            // Inline code
            escaped = escaped.replace(/`([^`]+)`/g, '<code class="bg-slate-200 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded text-xs font-mono">$1</code>');

            // Bold
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>');

            // Bullet lists
            escaped = escaped.replace(/^\s*[-*]\s+(.+)$/gm, '<li class="ml-4 list-disc">$1</li>');

            // Paragraphs / line breaks
            escaped = escaped.replace(/\n/g, '<br>');

            return escaped;
        }

        function copyCode(btn) {
            const pre = btn.parentElement.nextElementSibling.querySelector('code');
            const text = pre ? pre.textContent : '';
            // Safe fallback clipboard copy
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> コピー完了';
            setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
